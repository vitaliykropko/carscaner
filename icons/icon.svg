<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="100%" stop-color="#c40e22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" stroke="#c40e22" stroke-width="8"/>

  <!-- Gauge Arc Background -->
  <path d="M 125 360 A 170 170 0 1 1 387 360" fill="none" stroke="#252936" stroke-width="26" stroke-linecap="round"/>

  <!-- Gauge Arc Active (Red) -->
  <path d="M 125 360 A 170 170 0 1 1 340 145" fill="none" stroke="url(#redGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Ticks -->
  <circle cx="125" cy="360" r="5" fill="#8e99aa"/>
  <circle cx="256" cy="86" r="6" fill="#ff334b"/>
  <circle cx="387" cy="360" r="5" fill="#8e99aa"/>

  <!-- Center Pin & Needle -->
  <line x1="256" y1="265" x2="330" y2="155" stroke="#ff4d5a" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="265" r="32" fill="#20242e" stroke="#ff334b" stroke-width="6"/>
  <circle cx="256" cy="265" r="14" fill="#ffffff"/>

  <!-- Badge M6 GH -->
  <rect x="156" y="385" width="200" height="54" rx="27" fill="url(#redGrad)"/>
  <text x="256" y="422" fill="#ffffff" font-size="28" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="3">MAZDA 6</text>
</svg>
